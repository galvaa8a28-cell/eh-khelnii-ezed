headersOrigin = "config"
plugins = []
redirects = []

[database]

  [database.migrations]
  path = "/opt/build/repo/netlify/database/migrations"

[build]
publish = "dist"
publishOrigin = "config"
commandOrigin = "config"
command = "npm run build"

  [build.environment]
  NODE_VERSION = "24"

  [build.processing]

    [build.processing.css]

    [build.processing.html]

    [build.processing.images]

    [build.processing.js]

  [build.services]

[functions]

  [functions."*"]

[[headers]]
for = "/*"

  [headers.values]
  X-Content-Type-Options = "nosniff"
  Referrer-Policy = "same-origin"
  X-Frame-Options = "DENY"